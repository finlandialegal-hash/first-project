    size:
      width: 240
      height: 95

  - id: "card_game_2_icon"
    layer: 5
    type: "item"
    item: "DIAMOND_SWORD"
    position:
      x: 585
      y: 370
    size:
      width: 30
      height: 30

  - id: "card_game_2_title"
    layer: 4
    type: "text"
    color: "#ffffff"
    text: "SkyWars Solo"
    align: "left"
    position:
      x: 492
      y: 444
    size:
      width: 160
      height: 14

  - id: "card_game_2_stats"
    layer: 4
    type: "text"
    color: "#00e676"
    text: "👍 92%   👥 890"
    align: "left"
    position:
      x: 492
      y: 468
    size:
      width: 160
      height: 11

  - id: "card_game_2_btn_play"
    layer: 5
    type: "block"
    color: "#00e676"
    position:
      x: 672
      y: 450
    size:
      width: 36
      height: 36
    actions:
      - type: "command"
        value: "server connect skywars"
      - type: "sound"
        value: "entity.player.levelup"

  - id: "card_game_2_btn_txt"
    layer: 6
