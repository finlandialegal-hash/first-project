  # Jogo 2: SkyWars
  - id: "card_game_2_bg"
    layer: 3
    type: "block"
    color: "#1e2129"
    position:
      x: 480
      y: 340
    size:
      width: 240
      height: 160

  - id: "card_game_2_art"
    layer: 4
    type: "block"
    color: "#1d4ed8"
    position:
      x: 480
