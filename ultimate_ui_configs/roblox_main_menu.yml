  - id: "card_game_1_stats"
    layer: 4
    type: "text"
    color: "#00e676"
    text: "👍 95%   👥 2.4K"
    align: "left"
    position:
      x: 232
      y: 468
    size:
      width: 160
      height: 11

  - id: "card_game_1_btn_play"
    layer: 5
    type: "block"
    color: "#00e676"
    position:
      x: 412
      y: 450
    size:
      width: 36
      height: 36
