name: "roblox_avatar_menu"
screen:
  width: 1280
  height: 720
  offsetX: 0
  offsetY: 20
  cursor:
    layer: 100
    size: 12
    speed: 1
    color: "#ffffff"
behavior:
  keep-open: true

blocks:
  # Fundo Escuro
  - id: "bg_avatar"
    layer: 1
    type: "block"
    color: "#0f1115"
    position:
      x: 0
      y: 0
    size:
      width: 1280
      height: 720

  # Barra Superior
  - id: "avatar_top_bar"
    layer: 2
    type: "block"
    color: "#181a20"
    position:
      x: 0
      y: 0
    size:
      width: 1280
      height: 56

  - id: "btn_back_home"
    layer: 3
    type: "block"
    color: "#2a2e39"
    position:
      x: 20
      y: 12
    size:
      width: 140
      height: 32
    actions:
      - type: "command"
        value: "uui open roblox_main_menu"
      - type: "sound"
        value: "ui.button.click"

  - id: "txt_back_home"
    layer: 4
    type: "text"
    color: "#ffffff"
    text: "⬅ Voltar ao Início"
    align: "center"
    position:
      x: 20
      y: 20
    size:
      width: 140
      height: 14

  # Palco 3D do Avatar (Modelo Skin Minecraft 3D)
  - id: "avatar_stage_bg"
    layer: 2
    type: "block"
    color: "#181d26"
    position:
      x: 40
      y: 80
    size:
      width: 440
      height: 580

  - id: "player_3d_avatar"
    layer: 3
    type: "skin"
    skin: "%player%"
    color: "#ffffff"
    position:
      x: 60
      y: 120
    size:
      width: 400
      height: 480
    spin:
      spinning: true
      spin-speed: 80
      mouse: true
      up-down: true
      unlimited-rot: true

  # Painel de Customização à Direita
  - id: "customizer_panel_bg"
    layer: 2
    type: "block"
    color: "#181d26"
    position:
      x: 510
      y: 80
    size:
      width: 730
      height: 580

  - id: "txt_palette_title"
    layer: 3
    type: "text"
    color: "#ffffff"
    text: "Paleta de Cores de Pele (Estilo Roblox)"
    align: "left"
    position:
      x: 530
      y: 100
    size:
      width: 400
      height: 18

  # Cores da Paleta
  - id: "swatch_yellow"
    layer: 4
    type: "block"
    color: "#e5a00d"
    position:
      x: 530
      y: 140
    size:
      width: 60
      height: 60
    actions:
      - type: "command"
        value: "avatar skin color #e5a00d"

  - id: "swatch_tan"
    layer: 4
    type: "block"
