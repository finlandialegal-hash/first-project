  # Roupas e Itens
  - id: "txt_clothes_title"
    layer: 3
    type: "text"
    color: "#ffffff"
    text: "Roupas e Trajes"
    align: "left"
    position:
      x: 530
      y: 230
    size:
      width: 400
      height: 18

  - id: "item_shirt_casual"
    layer: 4
