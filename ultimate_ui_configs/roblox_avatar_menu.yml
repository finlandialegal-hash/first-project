  # Botão Salvar
  - id: "btn_save_avatar"
    layer: 4
    type: "block"
    color: "#00e676"
    position:
      x: 1040
      y: 590
    size:
      width: 180
      height: 46
    actions:
      - type: "command"
        value: "avatar save"
